<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I.I.S. Carlo Urbani – Orario 2025/26</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface2: #21262d;
    --border: #30363d;
    --accent: #00c9a7;
    --accent2: #ff6b6b;
    --accent3: #ffd166;
    --text: #e6edf3;
    --text-muted: #8b949e;
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
  }

  /* HEADER */
  header {
    background: linear-gradient(135deg, #0d1117 0%, #161b22 50%, #1a2332 100%);
    border-bottom: 1px solid var(--border);
    padding: 2rem 1.5rem 1.5rem;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  header::before {
    content: '';
    position: absolute;
    top: -60px; left: 50%; transform: translateX(-50%);
    width: 400px; height: 200px;
    background: radial-gradient(ellipse, rgba(0,201,167,0.15) 0%, transparent 70%);
    pointer-events: none;
  }
  .school-icon { font-size: 2.8rem; margin-bottom: 0.4rem; }
  header h1 {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: clamp(1.5rem, 5vw, 2.2rem);
    letter-spacing: -0.02em;
    line-height: 1.1;
    background: linear-gradient(135deg, #fff 40%, var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  header p {
    color: var(--text-muted);
    font-size: 0.9rem;
    margin-top: 0.5rem;
    letter-spacing: 0.05em;
  }
  .sede-badge {
    display: inline-block;
    margin-top: 0.6rem;
    font-size: 0.75rem;
    color: var(--accent);
    border: 1px solid rgba(0,201,167,0.3);
    padding: 2px 10px;
    border-radius: 20px;
    letter-spacing: 0.08em;
  }

  /* SEARCH AREA */
  .search-area {
    padding: 1.5rem;
    max-width: 600px;
    margin: 0 auto;
  }
  .search-box {
    position: relative;
    margin-bottom: 1rem;
  }
  .search-box input {
    width: 100%;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: 0.9rem 1rem 0.9rem 3rem;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 1rem;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .search-box input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(0,201,167,0.15);
  }
  .search-box input::placeholder { color: var(--text-muted); }
  .search-icon {
    position: absolute;
    left: 1rem; top: 50%; transform: translateY(-50%);
    font-size: 1.1rem;
    pointer-events: none;
  }

  /* TABS */
  .tabs {
    display: flex;
    gap: 0.75rem;
    margin-bottom: 1rem;
  }
  .tab {
    flex: 1;
    padding: 0.75rem;
    border-radius: var(--radius);
    border: 1.5px solid var(--border);
    background: var(--surface);
    color: var(--text-muted);
    font-family: 'Syne', sans-serif;
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
  }
  .tab.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #0d1117;
  }
  .tab:not(.active):hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  /* SUGGESTIONS */
  .suggestions {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    max-height: 240px;
    overflow-y: auto;
    display: none;
    margin-bottom: 1rem;
  }
  .suggestions.show { display: block; }
  .suggestion-item {
    padding: 0.7rem 1rem;
    cursor: pointer;
    font-size: 0.9rem;
    border-bottom: 1px solid var(--border);
    transition: background 0.15s;
  }
  .suggestion-item:last-child { border-bottom: none; }
  .suggestion-item:hover { background: var(--surface2); color: var(--accent); }

  /* PLACEHOLDER */
  .placeholder {
    text-align: center;
    padding: 3rem 1rem;
    color: var(--text-muted);
  }
  .placeholder-icon { font-size: 3rem; margin-bottom: 1rem; }
  .placeholder p { font-size: 0.95rem; line-height: 1.6; }

  /* RESULT HEADER */
  .result-header {
    padding: 0 1.5rem;
    max-width: 600px;
    margin: 0 auto 1rem;
    display: none;
  }
  .result-header.show { display: block; }
  .result-title {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 1.3rem;
    color: var(--text);
  }
  .result-subtitle {
    font-size: 0.8rem;
    color: var(--text-muted);
    margin-top: 0.2rem;
  }

  /* TIMETABLE */
  .timetable-wrap {
    padding: 0 0.75rem 2rem;
    max-width: 100%;
    margin: 0 auto;
    display: none;
    overflow-x: auto;
  }
  .timetable-wrap.show { display: block; }

  table.orario {
    width: 100%;
    border-collapse: separate;
    border-spacing: 2px;
    min-width: 420px;
  }
  table.orario thead th {
    background: var(--surface2);
    color: var(--accent);
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 0.55rem 0.3rem;
    text-align: center;
    border-radius: 6px;
  }
  table.orario thead th.ora-col {
    color: var(--text-muted);
    background: transparent;
    font-size: 0.65rem;
    min-width: 28px;
    width: 28px;
  }
  table.orario tbody td.ora-label {
    color: var(--accent);
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 0.7rem;
    text-align: center;
    padding: 0.3rem 0.2rem;
    background: var(--surface2);
    border-radius: 6px;
    vertical-align: middle;
  }
  table.orario tbody td.cell {
    background: var(--bg);
    border-radius: 6px;
    padding: 0.45rem 0.3rem;
    min-width: 60px;
    min-height: 56px;
    height: 56px;
    vertical-align: middle;
    text-align: center;
    position: relative;
    transition: background 0.15s;
  }
  table.orario tbody td.cell.filled {
    background: var(--surface2);
  }
  table.orario tbody td.cell.filled:hover {
    background: #2a3441;
  }
  .cell-materia {
    font-size: 0.62rem;
    font-weight: 700;
    color: var(--accent);
    line-height: 1.3;
    font-family: 'Syne', sans-serif;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    display: block;
  }
  .cell-info {
    font-size: 0.58rem;
    color: var(--text-muted);
    margin-top: 2px;
    line-height: 1.2;
    display: block;
  }

  /* no result */
  .no-result {
    text-align: center;
    padding: 2rem;
    color: var(--text-muted);
    font-size: 0.9rem;
  }

  /* scrollbar */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>

// ============================================================
// COSTRUZIONE ORARIO PER CLASSE
// ============================================================
function buildClasseTimetable(classe) {
  const result = {};
  GIORNI.forEach(g => { result[g] = [null,null,null,null,null,null]; });

  for (const [docente, orario] of Object.entries(orarioDocenti)) {
    for (const giorno of GIORNI) {
      const ore = orario[giorno] || [];
      ore.forEach((cella, i) => {
        if (i < 6 && cella && cella.classe === classe) {
          result[giorno][i] = { materia: cella.materia, docente };
        }
      });
    }
  }
  return result;
}

// ============================================================
// LISTA CLASSI
// ============================================================
const tutteLeClassi = new Set();
for (const orario of Object.values(orarioDocenti)) {
  for (const ore of Object.values(orario)) {
    ore.forEach(c => { if (c) tutteLeClassi.add(c.classe); });
  }
}
const classiList = [...tutteLeClassi].sort();
const docentiList = Object.keys(orarioDocenti).sort();

// ============================================================
// APP STATE
// ============================================================
let mode = 'docente';

function setMode(m) {
  mode = m;
  document.getElementById('tabDocente').className = 'tab' + (m === 'docente' ? ' active' : '');
  document.getElementById('tabClasse').className  = 'tab' + (m === 'classe' ? ' active' : '');
  document.getElementById('searchInput').value = '';
  document.getElementById('suggestions').classList.remove('show');
  hideTimetable();
}

function hideTimetable() {
  document.getElementById('resultHeader').classList.remove('show');
  document.getElementById('timetableWrap').classList.remove('show');
  document.getElementById('placeholder').style.display = 'block';
}

// Search input
const input = document.getElementById('searchInput');
const sugg = document.getElementById('suggestions');

input.addEventListener('input', () => {
  const val = input.value.trim().toLowerCase();
  if (!val) { sugg.classList.remove('show'); return; }

  const list = mode === 'docente' ? docentiList : classiList;
  const filtered = list.filter(x => x.toLowerCase().includes(val)).slice(0, 12);

  if (!filtered.length) { sugg.classList.remove('show'); return; }

  sugg.innerHTML = filtered.map(x => `<div class="suggestion-item" onclick="select('${x}')">${x}</div>`).join('');
  sugg.classList.add('show');
});

input.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const val = input.value.trim();
    if (val) select(val);
  }
});

document.addEventListener('click', e => {
  if (!e.target.closest('.search-box') && !e.target.closest('.suggestions')) {
    sugg.classList.remove('show');
  }
});

function select(name) {
  input.value = name;
  sugg.classList.remove('show');
  showTimetable(name);
}

function showTimetable(name) {
  let orario, subtitle;

  if (mode === 'docente') {
    // normalize
    const key = Object.keys(orarioDocenti).find(k => k.toLowerCase() === name.toLowerCase());
    if (!key) { renderNoResult(name); return; }
    orario = {};
    GIORNI.forEach(g => {
      orario[g] = (orarioDocenti[key][g] || []).slice(0, 6);
    });
    subtitle = 'Orario Docente';
    document.getElementById('resultTitle').textContent = key;
  } else {
    const key = classiList.find(k => k.toLowerCase() === name.toLowerCase());
    if (!key) { renderNoResult(name); return; }
    orario = buildClasseTimetable(key);
    subtitle = 'Orario Classe';
    document.getElementById('resultTitle').textContent = 'Classe ' + key;
  }

  document.getElementById('resultSubtitle').textContent = subtitle + ' · A.S. 2025/26';
  document.getElementById('resultHeader').classList.add('show');
  document.getElementById('placeholder').style.display = 'none';

  const wrap = document.getElementById('timetableWrap');
  wrap.innerHTML = '';

  const table = document.createElement('table');
  table.className = 'orario';

  // THEAD: ora-col + un th per giorno
  const thead = document.createElement('thead');
  const headRow = document.createElement('tr');
  const emptyTh = document.createElement('th');
  emptyTh.className = 'ora-col';
  emptyTh.textContent = '';
  headRow.appendChild(emptyTh);
  GIORNI_LABEL.forEach(label => {
    const th = document.createElement('th');
    th.textContent = label;
    headRow.appendChild(th);
  });
  thead.appendChild(headRow);
  table.appendChild(thead);

  // TBODY: una riga per ora
  const tbody = document.createElement('tbody');
  for (let i = 0; i < 6; i++) {
    const tr = document.createElement('tr');

    // etichetta ora
    const tdLabel = document.createElement('td');
    tdLabel.className = 'ora-label';
    tdLabel.textContent = (i + 1) + 'ª';
    tr.appendChild(tdLabel);

    // cella per ogni giorno
    GIORNI.forEach(giorno => {
      const ore = orario[giorno] || [];
      const data = ore[i];
      const td = document.createElement('td');
      td.className = 'cell' + (data ? ' filled' : '');
      if (data) {
        const mat = document.createElement('span');
        mat.className = 'cell-materia';
        mat.textContent = data.materia || data.classe || '';
        td.appendChild(mat);
        const info = document.createElement('span');
        info.className = 'cell-info';
        info.textContent = mode === 'docente' ? (data.classe || '') : (data.docente || '');
        td.appendChild(info);
      }
      tr.appendChild(td);
    });

    tbody.appendChild(tr);
  }
  table.appendChild(tbody);
  wrap.appendChild(table);
  wrap.classList.add('show');
}

function renderNoResult(name) {
  document.getElementById('placeholder').style.display = 'none';
  document.getElementById('resultHeader').classList.remove('show');
  const wrap = document.getElementById('timetableWrap');
  wrap.innerHTML = `<div class="no-result">Nessun risultato per "<strong>${name}</strong>"</div>`;
  wrap.classList.add('show');
}
</script>
